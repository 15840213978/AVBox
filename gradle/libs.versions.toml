commonsIo = "2.11.0"
juniversalchardet = "1.0.3"
# zxing:宿主必须向动态加载的爬虫 jar 提供 com.google.zxing.*(jar 运行期生成二维码)。
# 宿主源码里静态"零引用"属于正常现象,不可据此判定为孤儿依赖删除,否则爬虫 jar 会 NoClassDefFoundError 崩溃。
zxingCore = "3.5.4"
# 脱糖(core library desugaring):minSdk 24 下把 java.time / java.util.stream / java.nio.file 等 JDK 库 API
# 在编译期改写为 j$ 实现,避免低版本设备 NoClassDefFoundError。选 nio 变体(含 java.nio.file 支持),
# 与参考工程 fongmi 的 desugar_jdk_libs_nio 对齐;D8 按实际引用按需打包,无引用时几乎不增体积。
desugarJdkLibs = "2.1.5"
# ⚠️ 不要给宿主加 slf4j(2026-09-12 实测结论,已加过又撤回):爬虫 jar 把 slf4j-api shade 进了自己的
# 混淆包(merge.mu = LoggerFactory、merge.Pu = ILoggerFactory),运行期会去宿主找 org.slf4j.impl.StaticLoggerBinder。
# 宿主「没有」绑定时它内部回落到 NOP,属于正常降级;宿主「提供」标准绑定(api+nop)时,拿回的
# org.slf4j.helpers.NOPLoggerFactory 实现的是未混淆的 org.slf4j.ILoggerFactory,与 jar 的 merge.Pu 不兼容
# → IncompatibleClassChangeError(jar 的日志/配置引导路径报错)。证据:logs/logcat_full_20260912_232710.txt
# 另注:静态审计看到 jar 常量池引用 org.slf4j.* 并不代表宿主应当提供它 —— 这条只有跑起来才能证伪。
# player: media3 1.9.0 与 jellyfin media3-ffmpeg-decoder 1.9.0+1 的构建基线一致,不可单独升级
media3 = "1.9.0"
media3FfmpegDecoder = "1.9.0+1"
androidxAnnotation = "1.3.0"
dkplayerUi = "3.3.5"
quickjsWrapper = "3.2.3"
composeBom = "2026.08.00"
material3 = "1.5.0-alpha23"
androidxActivityCompose = "1.13.0"
androidxLifecycleRuntime = "2.11.0"
androidxCoreSplashscreen = "1.2.0"
coil = "3.6.2"
materialKolor = "5.0.1"

